        - preferences
        - updatedAt
      properties:
        deviceId:
          type: string
        preferences:
          type: array
          items:
            type: object
        updatedAt:
          type: string
          format: date-time
        conflict:
          type: string
          enum:
            - server_newer
            - client_applied
    InternalAuthError:
      type: object
