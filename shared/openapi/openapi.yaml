        - error
      properties:
        error:
          type: string
          enum:
            - missing_authorization
            - invalid_authorization_scheme
            - invalid_token
            - token_not_configured
    AdminOverview:
      type: object
      required:
        - service
        - database
        - featureFlags
        - secrets
        - queue
        - adapters
        - recentDelivery
      properties:
        service:
          type: object
          required:
            - name
            - environment
            - uptimeSeconds
          properties:
            name:
              type: string
              const: stellive-hub-api
            environment:
              type: string
            uptimeSeconds:
              type: integer
              minimum: 0
        database:
          type: object
          required:
            - status
            - reason
          properties:
            status:
              $ref: "#/components/schemas/AdminHealthStatus"
            reason:
              type: string
        featureFlags:
          type: object
          additionalProperties:
            oneOf:
              - type: boolean
              - type: string
        secrets:
          type: object
          additionalProperties:
            type: string
            enum:
              - configured
              - missing
        queue:
          $ref: "#/components/schemas/NotificationJobSummary"
        adapters:
          type: array
          items:
            $ref: "#/components/schemas/AdapterHealth"
        recentDelivery:
          $ref: "#/components/schemas/DeliveryAttemptSummary"
    AdminHealthStatus:
      type: string
      enum:
        - ok
        - degraded
        - disabled
        - verify_required
        - rate_limited
    AdapterHealth:
      type: object
      required:
        - source
        - status
        - reason
        - lastCheckedAt
      properties:
        source:
          type: string
          enum:
            - youtube
            - chzzk
            - naver_cafe
        status:
          type: string
          enum:
            - enabled
            - disabled
            - verify_required
            - rate_limited
        reason:
          type: string
        lastCheckedAt:
          type: string
          format: date-time
    NotificationJobSummary:
      type: object
      required:
        - queued
        - locked
        - completed
        - failed
      properties:
        queued:
          type: integer
          minimum: 0
        locked:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        oldestQueuedAt:
          type:
            - string
            - "null"
          format: date-time
    DeliveryAttemptSummary:
      type: object
      required:
        - sent
        - queued
        - skipped
        - failed
      properties:
        sent:
          type: integer
          minimum: 0
        queued:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
    NotificationJobDiagnostic:
      type: object
      required:
        - id
        - eventId
        - priority
        - status
        - runAfter
        - attempts
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        eventId:
          type: string
        priority:
          type: integer
        status:
          type: string
        runAfter:
          type: string
          format: date-time
        lockedAt:
          type:
            - string
            - "null"
          format: date-time
        attempts:
          type: integer
          minimum: 0
        lastError:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NotificationDrainRequest:
      type: object
      description: JSON request body for the drain placeholder route. The handler reads `limit` from this JSON body, not from the query string.
      properties:
        limit:
          description: Optional drain batch input. The server accepts string or numeric input, truncates decimals, clamps accepted values to 1..100, and falls back to 25 when the value is absent or invalid.
          oneOf:
            - type: string
            - type: integer
            - type: number
    NotificationDrainPlaceholderResult:
      type: object
      required:
        - claimed
        - completed
        - failed
        - skipped
        - status
        - reason
        - requestedLimit
      properties:
        claimed:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        status:
          type: string
          const: not_available
        reason:
          type: string
          const: notification_worker_not_available
        requestedLimit:
          type: integer
          minimum: 1
          maximum: 100
    InternalActionResult:
      type: object
      required:
        - status
        - reason
      properties:
        status:
          type: string
          enum:
            - disabled
            - verify_required
            - not_available
        reason:
          type: string
    WebhookSubscriptionDiagnostic:
      type: object
      required:
        - id
        - source
        - targetId
        - topicUrl
        - status
      properties:
        id:
          type: string
        source:
          type: string
        targetId:
          type: string
        topicUrl:
          type: string
        status:
          type: string
        leaseExpiresAt:
          type:
            - string
            - "null"
          format: date-time
        lastVerifiedAt:
