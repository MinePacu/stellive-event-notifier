        - preferences
        - clientUpdatedAt
      properties:
        deviceId:
          type: string
        preferences:
          type: array
          items:
            type: object
        clientUpdatedAt:
          type: string
          format: date-time
    UpdatePreferencesResponse:
      type: object
      required:
