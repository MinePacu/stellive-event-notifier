openapi: 3.1.0
info:
  title: Stellive Notification Hub API
  version: 0.1.0
  description: Unofficial fan-project API. Official YouTube live events for the Stellive official channel are excluded.
paths:
  /health:
    get:
      responses:
        "200":
          description: API health.
  /v1/bootstrap:
    get:
      responses:
        "200":
          description: App config, catalog, preferences, and realtime summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
  /v1/devices/register:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "200":
          description: Anonymous device registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDeviceResponse"
  /v1/devices/token:
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceTokenRequest"
      responses:
        "200":
          description: Push provider token update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDeviceTokenResponse"
  /v1/preferences:
    get:
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-side device preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesResponse"
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesRequest"
      responses:
        "200":
          description: Updated server-side device preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePreferencesResponse"
  /v1/members:
    get:
      responses:
        "200":
          description: Active/upcoming members, Gangzi, official channel, and placeholders.
  /v1/generations:
    get:
      responses:
        "200":
          description: Generation/category catalog.
  /v1/live-status:
    get:
      responses:
        "200":
          description: CHZZK live status for member and gamja entries. Live entries include startedAt normalized from CHZZK openDate when available.
  /v1/hub-events:
    get:
      summary: Official-source goods and event feed with filters.
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [online_goods, online_collab, offline_concert, offline_collab, offline_popup, ticketing]
        - name: participationMode
          in: query
          schema:
            type: string
            enum: [online, offline, hybrid]
        - name: status
          in: query
          schema:
            type: string
            enum: [announced, upcoming, open, closing_soon, ended, cancelled]
        - name: generationId
          in: query
          schema:
            type: string
        - name: memberId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            oneOf:
              - type: string
              - type: integer
            default: 25
            maximum: 100
      responses:
        "200":
          description: HubEvent list response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubEventListResponse"
        "400":
          description: Invalid HubEvent query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubEventQueryError"
  /v1/hub-events/calendar:
    get:
      summary: Hub event calendar grouped by local date.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: timezone
          in: query
          schema:
            type: string
            default: Asia/Seoul
      responses:
        "200":
          description: Goods event calendar days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubCalendarResponse"
        "400":
          description: Invalid calendar query, date range, or timezone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubEventQueryError"
  /v1/hub-events/widget-snapshot:
    get:
      summary: Compact hub event calendar snapshot for mobile widgets.
      parameters:
        - name: timezone
          in: query
          schema:
            type: string
            default: Asia/Seoul
        - name: limit
          in: query
          schema:
            oneOf:
              - type: string
              - type: integer
            default: 5
            maximum: 10
      responses:
        "200":
          description: Compact widget snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubCalendarWidgetSnapshot"
        "400":
          description: Invalid widget snapshot query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubEventQueryError"
  /v1/hub-events/{id}:
    get:
      summary: HubEvent detail by id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HubEvent detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubEvent"
        "404":
          description: Hub event not found.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [hub_event_not_found]
  /v1/hub-events/summary:
    get:
      responses:
        "200":
          description: Compact home preview metrics and up to three hub events.
  /v1/preferences:
    get:
      responses:
        "200":
          description: Device preferences.
    put:
      responses:
        "200":
          description: Updated device preferences.
  /v1/preferences/resolved:
    get:
      responses:
        "200":
          description: Resolved notification decision for a sample event.
  /v1/admin/hub-events:
    get:
      summary: List admin hub events
      responses:
        "200":
          description: Admin hub event list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventListResponse"
        "401":
          description: Admin authentication required.
    post:
      summary: Create a draft hub event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminHubEventCreateRequest"
      responses:
        "201":
          description: Draft hub event created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
        "400":
          description: Validation failed.
        "401":
          description: Admin authentication required.
  /v1/admin/hub-events/{id}:
    get:
      summary: Get an admin hub event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Admin hub event detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
        "404":
          description: Hub event not found.
    put:
      summary: Update an admin hub event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminHubEventUpdateRequest"
      responses:
        "200":
          description: Hub event updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
        "400":
          description: Validation failed.
    delete:
      summary: Soft delete an admin hub event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hub event soft deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
  /v1/admin/hub-events/{id}/publish:
    post:
      summary: Publish a hub event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hub event published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
  /v1/admin/hub-events/{id}/cancel:
    post:
      summary: Cancel a published hub event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hub event cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
  /v1/admin/hub-events/{id}/deactivate:
    post:
      summary: Deactivate a hub event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hub event deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
  /v1/admin/hub-events/{id}/audit-log:
    get:
      summary: List hub event audit log entries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hub event audit log.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/HubEventAuditLogEntry"
  /v1/admin/hub-events/validate:
    post:
      summary: Validate a hub event write payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input
              properties:
                mode:
                  type: string
                  enum: [draft, publish]
                  default: draft
                input:
                  $ref: "#/components/schemas/AdminHubEventCreateRequest"
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                  - errors
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminHubEventValidationError"
  /v1/realtime/status:
    get:
      responses:
        "200":
          description: Adapter and realtime queue status.
  /v1/events/stream:
    get:
      responses:
        "200":
          description: Foreground SSE stream for UI updates.
  /v1/notifications/delivery-attempts:
    get:
      responses:
        "200":
          description: Short-lived server delivery attempts for diagnostics. User-visible notification history is stored on device.
  /v1/internal/admin/overview:
    get:
      security:
        - internalBearerAuth: []
      responses:
        "200":
          description: Internal admin overview for the embedded OCI admin console.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/adapters/health:
    get:
      security:
        - internalBearerAuth: []
      responses:
        "200":
          description: Adapter health for supported platform integrations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdapterHealth"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/jobs/notifications:
    get:
      security:
        - internalBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InternalLimit25"
      responses:
        "200":
          description: Notification job diagnostics with a bounded limit.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationJobDiagnostic"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/jobs/notifications/drain:
    post:
      security:
        - internalBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDrainRequest"
      responses:
        "200":
          description: Bounded notification worker drain trigger placeholder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDrainPlaceholderResult"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/webhooks/subscriptions:
    get:
      security:
        - internalBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InternalLimit50"
      responses:
        "200":
          description: Webhook subscription diagnostics for internal operations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookSubscriptionDiagnostic"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/schedulers/youtube/renew-subscriptions:
    post:
      security:
        - internalBearerAuth: []
      responses:
        "200":
          description: Trigger result for YouTube WebSub subscription renewal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalActionResult"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/schedulers/chzzk/live-status:
    post:
      security:
        - internalBearerAuth: []
      responses:
        "200":
          description: Trigger result for CHZZK live status polling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalActionResult"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/live-status:
    get:
      security:
        - internalBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InternalLimit50"
      responses:
        "200":
          description: Internal live status diagnostics from the backend cache.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveStatusDiagnostic"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/delivery-attempts:
    get:
      security:
        - internalBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InternalLimit25"
      responses:
        "200":
          description: Recent internal delivery attempt diagnostics with sensitive values omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryAttemptDiagnostic"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
components:
  securitySchemes:
    internalBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Bearer token protection for `/v1/internal/*` operational routes.
  parameters:
    InternalLimit25:
      name: limit
      in: query
      required: false
      description: Optional limit input for internal diagnostics. The server accepts string or numeric input, truncates decimals, clamps accepted values to 1..100, and falls back to the route default of 25 when the value is absent or invalid.
      schema:
        oneOf:
          - type: string
          - type: integer
          - type: number
    InternalLimit50:
      name: limit
      in: query
      required: false
      description: Optional limit input for internal diagnostics. The server accepts string or numeric input, truncates decimals, clamps accepted values to 1..100, and falls back to the route default of 50 when the value is absent or invalid.
      schema:
        oneOf:
          - type: string
          - type: integer
          - type: number
  responses:
    InternalUnauthorized:
      description: Missing, invalid, or unconfigured internal bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalAuthError"
  schemas:
    HubEventListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HubEvent"
        nextCursor:
          type: string
    HubEventQueryError:
      type: object
      required:
        - error
        - field
      properties:
        error:
          type: string
          enum:
            - invalid_hub_event_query
        field:
          type: string
    HubCalendarEntry:
      type: object
      required:
        - id
        - eventId
        - title
        - category
        - status
        - participationMode
        - generationId
        - displayDate
        - displayTimeText
        - sourceLabel
        - appDeepLink
        - platformUrl
      properties:
        id:
          type: string
        eventId:
          type: string
        title:
          type: string
        category:
          type: string
          enum:
            - online_goods
            - online_collab
            - offline_concert
            - offline_collab
            - offline_popup
            - ticketing
        status:
          type: string
          enum:
            - announced
            - upcoming
            - open
            - closing_soon
            - ended
            - cancelled
        participationMode:
          type: string
          enum:
            - online
            - offline
            - hybrid
        generationId:
          type: string
        memberId:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        displayDate:
          type: string
          format: date
        displayTimeText:
          type: string
        sourceLabel:
          type: string
        appDeepLink:
          type: string
        platformUrl:
          type: string
    HubCalendarDay:
      type: object
      required:
        - date
        - entries
      properties:
        date:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: "#/components/schemas/HubCalendarEntry"
    HubCalendarResponse:
      type: object
      required:
        - timezone
        - from
        - to
        - days
      properties:
        timezone:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: array
          items:
            $ref: "#/components/schemas/HubCalendarDay"
    HubCalendarWidgetSnapshot:
      type: object
      required:
        - generatedAt
        - timezone
        - entries
        - staleAfter
      properties:
        generatedAt:
          type: string
          format: date-time
        timezone:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/HubCalendarEntry"
      staleAfter:
        type: string
        format: date-time
    MobileConfig:
      type: object
      required:
        - unofficialProject
        - catalogVersion
        - officialYoutubeLiveExcluded
        - xNotificationsEnabled
        - hubCalendarEnabled
        - foregroundRealtimeEnabled
      properties:
        unofficialProject:
          type: boolean
          const: true
        catalogVersion:
          type: string
        officialYoutubeLiveExcluded:
          type: boolean
          const: true
        xNotificationsEnabled:
          type: boolean
        xDisabledReason:
          type: string
        hubCalendarEnabled:
          type: boolean
        foregroundRealtimeEnabled:
          type: boolean
    BootstrapDevice:
      type: object
      required:
        - deviceId
        - registered
      properties:
        deviceId:
          type: string
        registered:
          type: boolean
        tokenStatus:
          type: string
          enum:
            - missing
            - active
            - invalid
            - expired
    BootstrapCatalog:
      type: object
      required:
        - generations
        - members
      properties:
        generations:
          type: array
          items:
            type: object
        members:
          type: array
          items:
            type: object
    HubEventsSummary:
      type: object
      required:
        - openCount
        - upcomingCount
        - closingSoonCount
        - preview
      properties:
        openCount:
          type: integer
          minimum: 0
        upcomingCount:
          type: integer
          minimum: 0
        closingSoonCount:
          type: integer
          minimum: 0
        preview:
          type: array
          items:
            type: object
    BootstrapResponse:
      type: object
      required:
        - config
        - catalog
        - preferences
        - liveStatus
        - hubEventsSummary
        - serverTime
      properties:
        config:
          $ref: "#/components/schemas/MobileConfig"
        device:
          $ref: "#/components/schemas/BootstrapDevice"
        catalog:
          $ref: "#/components/schemas/BootstrapCatalog"
        preferences:
          type: array
          items:
            type: object
        liveStatus:
          type: array
          items:
            $ref: "#/components/schemas/LiveStatusDiagnostic"
        hubEventsSummary:
          $ref: "#/components/schemas/HubEventsSummary"
        hubCalendarWidgetSnapshot:
          $ref: "#/components/schemas/HubCalendarWidgetSnapshot"
        serverTime:
          type: string
          format: date-time
    RegisterDeviceRequest:
      type: object
      required:
        - platform
      properties:
        deviceId:
          type: string
        platform:
          type: string
          enum:
            - android
            - ios
        appVersion:
          type: string
        locale:
          type: string
        timezone:
          type: string
        installationId:
          type: string
    RegisterDeviceResponse:
      type: object
      required:
        - deviceId
        - registered
        - serverTime
      properties:
        deviceId:
          type: string
        registered:
          type: boolean
          const: true
        serverTime:
          type: string
          format: date-time
    UpdateDeviceTokenRequest:
      type: object
      required:
        - deviceId
        - platform
        - provider
        - token
      properties:
        deviceId:
          type: string
        platform:
          type: string
          enum:
            - android
            - ios
        provider:
          type: string
          enum:
            - fcm
            - apns_via_fcm
        token:
          type: string
        appVersion:
          type: string
        locale:
          type: string
        timezone:
          type: string
    UpdateDeviceTokenResponse:
      type: object
      required:
        - updated
        - tokenStatus
        - serverTime
      properties:
        updated:
          type: boolean
          const: true
        tokenStatus:
          type: string
          enum:
            - active
        serverTime:
          type: string
          format: date-time
    PreferencesResponse:
      type: object
      required:
        - deviceId
        - preferences
        - updatedAt
      properties:
        deviceId:
          type: string
        preferences:
          type: array
          items:
            type: object
        updatedAt:
          type: string
          format: date-time
    UpdatePreferencesRequest:
      type: object
      required:
        - deviceId
        - preferences
        - clientUpdatedAt
      properties:
        deviceId:
          type: string
        preferences:
          type: array
          items:
            type: object
        clientUpdatedAt:
          type: string
          format: date-time
    UpdatePreferencesResponse:
      type: object
      required:
        - deviceId
        - preferences
        - updatedAt
      properties:
        deviceId:
          type: string
        preferences:
          type: array
          items:
            type: object
        updatedAt:
          type: string
          format: date-time
        conflict:
          type: string
          enum:
            - server_newer
            - client_applied
    InternalAuthError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - missing_authorization
            - invalid_authorization_scheme
            - invalid_token
            - token_not_configured
    AdminOverview:
      type: object
      required:
        - service
        - database
        - featureFlags
        - secrets
        - queue
        - adapters
        - recentDelivery
      properties:
        service:
          type: object
          required:
            - name
            - environment
            - uptimeSeconds
          properties:
            name:
              type: string
              const: stellive-hub-api
            environment:
              type: string
            uptimeSeconds:
              type: integer
              minimum: 0
        database:
          type: object
          required:
            - status
            - reason
          properties:
            status:
              $ref: "#/components/schemas/AdminHealthStatus"
            reason:
              type: string
        featureFlags:
          type: object
          additionalProperties:
            oneOf:
              - type: boolean
              - type: string
        secrets:
          type: object
          additionalProperties:
            type: string
            enum:
              - configured
              - missing
        queue:
          $ref: "#/components/schemas/NotificationJobSummary"
        adapters:
          type: array
          items:
            $ref: "#/components/schemas/AdapterHealth"
        recentDelivery:
          $ref: "#/components/schemas/DeliveryAttemptSummary"
    AdminHealthStatus:
      type: string
      enum:
        - ok
        - degraded
        - disabled
        - verify_required
        - rate_limited
    AdapterHealth:
      type: object
      required:
        - source
        - status
        - reason
        - lastCheckedAt
      properties:
        source:
          type: string
          enum:
            - youtube
            - chzzk
