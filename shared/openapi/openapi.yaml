openapi: 3.1.0
info:
  title: Stellive Notification Hub API
  version: 0.1.0
  description: Unofficial fan-project API. Official YouTube live events for the Stellive official channel are excluded.
paths:
  /health:
    get:
      responses:
        "200":
          description: API health.
  /v1/bootstrap:
    get:
      parameters:
        - { name: platform, in: query, schema: { $ref: "#/components/schemas/ServiceAnnouncementPlatform" } }
        - { name: appVersion, in: query, schema: { type: string } }
      responses:
        "200":
          description: App config, catalog, preferences, and realtime summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
  /v1/announcements:
    get:
      summary: Published app service announcements.
      parameters:
        - { name: platform, in: query, schema: { $ref: "#/components/schemas/ServiceAnnouncementPlatform" } }
        - { name: appVersion, in: query, schema: { type: string } }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Cursor-paginated visible announcements.
          content: { application/json: { schema: { $ref: "#/components/schemas/ServiceAnnouncementListResponse" } } }
  /v1/announcements/summary:
    get:
      summary: Short-lived announcement badge and pinned-home summary.
      parameters:
        - { name: platform, in: query, schema: { $ref: "#/components/schemas/ServiceAnnouncementPlatform" } }
        - { name: appVersion, in: query, schema: { type: string } }
      responses:
        "200":
          description: Announcement summary.
          content: { application/json: { schema: { $ref: "#/components/schemas/AnnouncementsSummary" } } }
  /v1/announcements/{id}:
    get:
      summary: A currently visible app service announcement.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: platform, in: query, schema: { $ref: "#/components/schemas/ServiceAnnouncementPlatform" } }
        - { name: appVersion, in: query, schema: { type: string } }
      responses:
        "200":
          description: Announcement detail.
          content: { application/json: { schema: { $ref: "#/components/schemas/ServiceAnnouncement" } } }
        "404": { description: Announcement is missing or not visible to this client. }
  /v1/admin/announcements:
    get:
      summary: Admin announcement list.
      responses: { "200": { description: Admin announcement list. } }
    post:
      summary: Create an announcement draft.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminServiceAnnouncementWrite" } } } }
      responses: { "201": { description: Draft created. } }
  /v1/admin/announcements/{id}:
    get:
      summary: Admin announcement detail.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Admin announcement detail. } }
    patch:
      summary: Update an announcement and increment revision without changing attentionRevision.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminServiceAnnouncementWrite" } } } }
      responses: { "200": { description: Announcement updated. } }
    delete:
      summary: Soft-delete an announcement while preserving its audit and push history.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: Announcement deleted and hidden from public and default admin reads. }
        "404": { description: Announcement is missing or already deleted. }
  /v1/admin/announcements/{id}/publish:
    post:
      summary: Publish a stored announcement and optionally send its FCM notification.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Published announcement. } }
  /v1/admin/announcements/{id}/resolve:
    post:
      summary: Mark an incident announcement as resolved.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Resolved announcement. } }
  /v1/admin/announcements/{id}/archive:
    post:
      summary: Archive a stored announcement.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Archived announcement. } }
  /v1/admin/announcements/{id}/resend:
    post:
      summary: Explicitly resend FCM without changing attentionRevision.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Push attempt result. } }
  /v1/admin/announcements/{id}/bump-attention:
    post:
      summary: Increment attentionRevision so clients treat the announcement as unread again.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Updated announcement. } }
  /v1/admin/announcements/{id}/audit-log:
    get:
      summary: Announcement lifecycle audit log.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Audit log entries. } }
  /v1/admin/announcements/{id}/push-attempts:
    get:
      summary: Announcement FCM attempt history.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Push attempt entries. } }
  /v1/devices/register:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "200":
          description: Anonymous device registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDeviceResponse"
  /v1/devices/token:
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceTokenRequest"
      responses:
        "200":
          description: Push provider token update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDeviceTokenResponse"
  /v1/preferences:
    get:
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-side device preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesResponse"
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesRequest"
      responses:
        "200":
          description: Updated server-side device preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePreferencesResponse"
  /v1/members:
    get:
      responses:
        "200":
          description: Active/upcoming members, Gangzi, official channel, and placeholders.
  /v1/generations:
    get:
      responses:
        "200":
          description: Generation/category catalog.
  /v1/live-status:
    get:
      responses:
        "200":
          description: CHZZK live status for member and gamja entries. Live entries include startedAt normalized from CHZZK openDate when available.
  /v1/hub-events:
    get:
      summary: Official-source goods and event feed with filters.
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [online_goods, online_collab, offline_concert, offline_collab, offline_popup, ticketing]
        - name: participationMode
          in: query
          schema:
            type: string
            enum: [online, offline, hybrid]
        - name: status
          in: query
          schema:
            type: string
            enum: [announced, upcoming, open, closing_soon, ended, cancelled]
        - name: generationId
          in: query
          schema:
            type: string
        - name: memberId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            oneOf:
              - type: string
              - type: integer
            default: 25
            maximum: 100
      responses:
        "200":
          description: HubEvent list response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubEventListResponse"
        "400":
          description: Invalid HubEvent query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubEventQueryError"
  /v1/hub-events/calendar:
    get:
      summary: Hub event calendar grouped by local date.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: timezone
          in: query
          schema:
            type: string
            default: Asia/Seoul
        - name: includeSpecialDays
          in: query
          schema:
            type: boolean
            default: true
        - name: entryKind
          in: query
          schema:
            type: string
            description: Comma-separated calendar entry kinds.
            example: hub_event,member_birthday
      responses:
        "200":
          description: Goods event calendar days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubCalendarResponse"
        "400":
          description: Invalid calendar query, date range, or timezone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubEventQueryError"
  /v1/hub-events/widget-snapshot:
    get:
      summary: Compact hub event calendar snapshot for mobile widgets.
      parameters:
        - name: timezone
          in: query
          schema:
            type: string
            default: Asia/Seoul
        - name: includeSpecialDays
          in: query
          schema:
            type: boolean
            default: true
        - name: entryKind
          in: query
          schema:
            type: string
            description: Comma-separated calendar entry kinds.
            example: hub_event,member_birthday
        - name: limit
          in: query
          schema:
            oneOf:
              - type: string
              - type: integer
            default: 5
            maximum: 10
      responses:
        "200":
          description: Compact widget snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubCalendarWidgetSnapshot"
        "400":
          description: Invalid widget snapshot query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubEventQueryError"
  /v1/hub-events/{id}:
    get:
      summary: HubEvent detail by id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HubEvent detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubEvent"
        "404":
          description: Hub event not found.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [hub_event_not_found]
  /v1/hub-events/summary:
    get:
      responses:
        "200":
          description: Compact home preview metrics and up to three hub events.
  /v1/songs/facets:
    get:
      summary: Mobile song page facet counts.
      parameters:
        - name: generationId
          in: query
          schema:
            type: string
            enum: [all, gen1, gen2, gen3]
        - name: memberId
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [all, original, cover]
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Summary, generation, member, and type counts for the mobile song page.
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, max-age=60
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongFacetsResponse"
        "400":
          description: Invalid song facet query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongQueryError"
  /v1/songs:
    get:
      summary: Mobile song page cached song list.
      parameters:
        - name: generationId
          in: query
          schema:
            type: string
            enum: [all, gen1, gen2, gen3]
        - name: memberId
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [all, original, cover]
        - name: q
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            oneOf:
              - type: string
              - type: integer
            default: 30
            maximum: 50
      responses:
        "200":
          description: Cached backend song list for mobile clients. Route handlers do not call YouTube directly.
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, max-age=30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongListResponse"
        "400":
          description: Invalid song list query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongQueryError"
  /v1/music:
    get:
      summary: Playlist-first music catalog list.
      description: Cached backend music list. Route handlers read DB/cache only and do not call YouTube directly.
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [all, cover, original, other]
            default: all
        - name: memberId
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            oneOf:
              - type: string
              - type: integer
            default: 30
            maximum: 50
        - name: sort
          in: query
          schema:
            type: string
            enum: [publishedAt_desc]
            default: publishedAt_desc
      responses:
        "200":
          description: Cached normalized music list.
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, max-age=300, stale-while-revalidate=600
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicListResponse"
        "400":
          description: Invalid music list query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicQueryError"
  /v1/music/{id}:
    get:
      summary: Playlist-first music item detail.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cached normalized music item detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicDetailResponse"
        "404":
          description: Music item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicQueryError"
  /v1/members/{id}/music:
    get:
      summary: Playlist-first music list for a member.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [all, cover, original, other]
            default: all
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            oneOf:
              - type: string
              - type: integer
            default: 30
            maximum: 50
      responses:
        "200":
          description: Cached normalized member music list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicMemberMusicResponse"
        "400":
          description: Invalid member music query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicQueryError"
        "404":
          description: Music member not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicQueryError"
  /v1/preferences:
    get:
      responses:
        "200":
          description: Device preferences.
    put:
      responses:
        "200":
          description: Updated device preferences.
  /v1/preferences/resolved:
    get:
      responses:
        "200":
          description: Resolved notification decision for a sample event.
  /v1/admin/hub-events:
    get:
      summary: List admin hub events
      responses:
        "200":
          description: Admin hub event list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventListResponse"
        "401":
          description: Admin authentication required.
    post:
      summary: Create a draft hub event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminHubEventCreateRequest"
      responses:
        "201":
          description: Draft hub event created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
        "400":
          description: Validation failed.
        "401":
          description: Admin authentication required.
  /v1/admin/hub-events/{id}:
    get:
      summary: Get an admin hub event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Admin hub event detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
        "404":
          description: Hub event not found.
    put:
      summary: Update an admin hub event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminHubEventUpdateRequest"
      responses:
        "200":
          description: Hub event updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
        "400":
          description: Validation failed.
    delete:
      summary: Soft delete an admin hub event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hub event soft deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
  /v1/admin/hub-events/{id}/publish:
    post:
      summary: Publish a hub event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hub event published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
  /v1/admin/hub-events/{id}/schedule-items:
    post:
      summary: Add a schedule item to an admin hub event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminHubEventScheduleItemCreateRequest"
      responses:
        "201":
          description: Schedule item created and parent revision incremented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
        "409":
          description: Parent revision conflict.
  /v1/admin/hub-events/{id}/schedule-items/{scheduleItemId}:
    patch:
      summary: Update a schedule item
      parameters:
        - $ref: "#/components/parameters/HubEventId"
        - $ref: "#/components/parameters/HubEventScheduleItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminHubEventScheduleItemMutationRequest"
      responses:
        "200":
          description: Schedule item updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
        "409":
          description: Parent revision conflict.
    delete:
      summary: Delete a safe draft schedule item or cancel a reference-prone item
      parameters:
        - $ref: "#/components/parameters/HubEventId"
        - $ref: "#/components/parameters/HubEventScheduleItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminHubEventRevisionRequest"
      responses:
        "200":
          description: Schedule item deleted or cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventScheduleDeleteResponse"
        "409":
          description: Parent revision conflict.
  /v1/admin/hub-events/{id}/schedule-items/{scheduleItemId}/restore:
    post:
      summary: Restore a cancelled schedule item
      parameters:
        - $ref: "#/components/parameters/HubEventId"
        - $ref: "#/components/parameters/HubEventScheduleItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminHubEventRevisionRequest"
      responses:
        "200":
          description: Schedule item restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
        "409":
          description: Parent revision conflict.
  /v1/admin/hub-events/{id}/schedule-items/order:
    put:
      summary: Reorder all schedule items
      parameters:
        - $ref: "#/components/parameters/HubEventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminHubEventScheduleOrderRequest"
      responses:
        "200":
          description: Schedule items reordered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
        "409":
          description: Parent revision conflict.
  /v1/admin/hub-events/{id}/cancel:
    post:
      summary: Cancel a published hub event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hub event cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
  /v1/admin/hub-events/{id}/deactivate:
    post:
      summary: Deactivate a hub event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hub event deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHubEventResponse"
  /v1/admin/hub-events/{id}/audit-log:
    get:
      summary: List hub event audit log entries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hub event audit log.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/HubEventAuditLogEntry"
  /v1/admin/hub-events/validate:
    post:
      summary: Validate a hub event write payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input
              properties:
                mode:
                  type: string
                  enum: [draft, publish]
                  default: draft
                input:
                  $ref: "#/components/schemas/AdminHubEventCreateRequest"
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                  - errors
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminHubEventValidationError"
  /v1/realtime/status:
    get:
      responses:
        "200":
          description: Adapter and realtime queue status.
  /v1/events/stream:
    get:
      responses:
        "200":
          description: Foreground SSE stream for UI updates.
  /v1/notifications/delivery-attempts:
    get:
      responses:
        "200":
          description: Short-lived server delivery attempts for diagnostics. User-visible notification history is stored on device.
  /v1/internal/admin/overview:
    get:
      security:
        - internalBearerAuth: []
      responses:
        "200":
          description: Internal admin overview for the embedded OCI admin console.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/adapters/health:
    get:
      security:
        - internalBearerAuth: []
      responses:
        "200":
          description: Adapter health for supported platform integrations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdapterHealth"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/jobs/notifications:
    get:
      security:
        - internalBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InternalLimit25"
      responses:
        "200":
          description: Notification job diagnostics with a bounded limit.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationJobDiagnostic"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/jobs/notifications/drain:
    post:
      security:
        - internalBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDrainRequest"
      responses:
        "200":
          description: Bounded notification worker drain trigger placeholder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDrainPlaceholderResult"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/webhooks/subscriptions:
    get:
      security:
        - internalBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InternalLimit50"
      responses:
        "200":
          description: Webhook subscription diagnostics for internal operations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookSubscriptionDiagnostic"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/schedulers/youtube/renew-subscriptions:
    post:
      security:
        - internalBearerAuth: []
      responses:
        "200":
          description: Trigger result for YouTube WebSub subscription renewal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalActionResult"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/schedulers/chzzk/live-status:
    post:
      security:
        - internalBearerAuth: []
      responses:
        "200":
          description: Trigger result for CHZZK live status polling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalActionResult"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/live-status:
    get:
      security:
        - internalBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InternalLimit50"
      responses:
        "200":
          description: Internal live status diagnostics from the backend cache.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveStatusDiagnostic"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
  /v1/internal/delivery-attempts:
    get:
      security:
        - internalBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InternalLimit25"
      responses:
        "200":
          description: Recent internal delivery attempt diagnostics with sensitive values omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryAttemptDiagnostic"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
components:
  securitySchemes:
    internalBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Bearer token protection for `/v1/internal/*` operational routes.
  parameters:
    HubEventId:
      name: id
      in: path
      required: true
      schema:
        type: string
    HubEventScheduleItemId:
      name: scheduleItemId
      in: path
      required: true
      schema:
        type: string
    InternalLimit25:
      name: limit
      in: query
      required: false
      description: Optional limit input for internal diagnostics. The server accepts string or numeric input, truncates decimals, clamps accepted values to 1..100, and falls back to the route default of 25 when the value is absent or invalid.
      schema:
        oneOf:
          - type: string
          - type: integer
          - type: number
    InternalLimit50:
      name: limit
      in: query
      required: false
      description: Optional limit input for internal diagnostics. The server accepts string or numeric input, truncates decimals, clamps accepted values to 1..100, and falls back to the route default of 50 when the value is absent or invalid.
      schema:
        oneOf:
          - type: string
          - type: integer
          - type: number
  responses:
    InternalUnauthorized:
      description: Missing, invalid, or unconfigured internal bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalAuthError"
  schemas:
    HubEventListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HubEvent"
        nextCursor:
          type: string
    HubEventQueryError:
      type: object
      required:
        - error
        - field
      properties:
        error:
          type: string
          enum:
            - invalid_hub_event_query
        field:
          type: string
    HubCalendarEntry:
      type: object
      required:
        - id
        - eventId
        - entryKind
        - title
        - category
        - status
        - participationMode
        - generationId
        - displayDate
        - displayTimeText
        - sourceLabel
        - appDeepLink
      properties:
        id:
          type: string
        eventId:
          type: string
        entryKind:
          type: string
          enum:
            - hub_event
            - member_birthday
            - generation_anniversary
        specialDayKind:
          type: string
          enum:
            - member_birthday
            - generation_anniversary
        specialDayLabel:
          type: string
        scheduleItemId:
          type: string
        scheduleKind:
          $ref: "#/components/schemas/HubEventScheduleKind"
        scheduleLabel:
          type: string
        title:
          type: string
        category:
          type: string
          enum:
            - online_goods
            - online_collab
            - offline_concert
            - offline_collab
            - offline_popup
            - ticketing
        status:
          type: string
          enum:
            - announced
            - upcoming
            - open
            - closing_soon
            - ended
            - cancelled
        participationMode:
          type: string
          enum:
            - online
            - offline
            - hybrid
        generationId:
          type: string
        memberId:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        displayDate:
          type: string
          format: date
        displayTimeText:
          type: string
        sourceLabel:
          type: string
        appDeepLink:
          type: string
        platformUrl:
          type: string
    HubCalendarDay:
      type: object
      required:
        - date
        - entries
      properties:
        date:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: "#/components/schemas/HubCalendarEntry"
    HubCalendarResponse:
      type: object
      required:
