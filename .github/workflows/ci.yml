name: CI

on:
  pull_request:
    branches:
      - main
    types: [closed]
  workflow_dispatch:

jobs:
  backend:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/stellive-hub-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/stellive-hub-api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  android:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Android debug build
        working-directory: android/StelliveHubAndroid
        run: gradle assembleDebug

  ios-example:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: iOS build example
        working-directory: ios/StelliveHubiOS
        run: xcodebuild -project StelliveHubiOS.xcodeproj -scheme StelliveHubiOS -destination 'platform=iOS Simulator,name=iPhone 16' build
