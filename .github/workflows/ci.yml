name: CI

on:
  pull_request:
    branches:
      - main
    types: [closed]
  workflow_dispatch:
    inputs:
      target:
        description: "CI target to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend
          - android
          - ios

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - backend/stellive-hub-api/**
              - shared/**
              - .github/workflows/ci.yml
            android:
              - android/StelliveHubAndroid/**
              - shared/**
              - .github/workflows/ci.yml
            ios:
              - ios/StelliveHubiOS/**
              - shared/**
              - .github/workflows/ci.yml

  backend:
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'backend')) || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/stellive-hub-api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/stellive-hub-api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run build
      - run: pnpm test

  android:
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'android')) || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        working-directory: android/StelliveHubAndroid
        run: chmod +x ./gradlew
      - name: Android lint, unit tests, and debug build
        working-directory: android/StelliveHubAndroid
        run: ./gradlew --no-daemon --continue lintDebug testDebugUnitTest assembleDebug

  ios-example:
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'ios')) || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && needs.changes.outputs.ios == 'true') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: iOS build example
        working-directory: ios/StelliveHubiOS
        run: xcodebuild -project StelliveHubiOS.xcodeproj -scheme StelliveHubiOS -destination 'platform=iOS Simulator,name=iPhone 16' build
