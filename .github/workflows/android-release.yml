name: Android Release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/StelliveHubAndroid
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_PATH: app/google-services.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Set keystore path
        run: echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/stellive-hub-release.jks" >> "$GITHUB_ENV"

      - name: Validate release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$GOOGLE_SERVICES_JSON_BASE64"

      - name: Materialize build credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$GOOGLE_SERVICES_JSON_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH" "$GOOGLE_SERVICES_JSON_PATH"

      - name: Validate tag and Gradle version
        id: version
        run: |
          test "${GITHUB_REF_TYPE}" = "tag"
          VERSION_NAME="$(./gradlew --no-daemon -q :app:printVersionName)"
          VERSION_CODE="$(./gradlew --no-daemon -q :app:printVersionCode)"
          test "${GITHUB_REF_NAME}" = "android-v${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Test and build signed release APK
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify release APK signature
        run: |
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE_APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SOURCE_APK"

      - name: Prepare release assets
        id: assets
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE_APK"
          APK_NAME="stellive-hub-${GITHUB_REF_NAME}.apk"
          cp "$SOURCE_APK" "$APK_NAME"
          APK_SIZE="$(stat -c '%s' "$APK_NAME")"
          APK_SHA256="$(sha256sum "$APK_NAME" | cut -d ' ' -f 1)"
          jq -n \
            --arg packageName "dev.minepacu.stelliveeventnotifier" \
            --arg versionName "$VERSION_NAME" \
            --arg apkAssetName "$APK_NAME" \
            --arg sha256 "$APK_SHA256" \
            --argjson versionCode "$VERSION_CODE" \
            --argjson apkSize "$APK_SIZE" \
            '{
              schemaVersion: 1,
              packageName: $packageName,
              versionCode: $versionCode,
              versionName: $versionName,
              minimumSupportedVersionCode: 1,
              mandatory: false,
              apkAssetName: $apkAssetName,
              apkSize: $apkSize,
              sha256: $sha256
            }' > android-update.json
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.assets.outputs.apk_name }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$APK_NAME" android-update.json --clobber
