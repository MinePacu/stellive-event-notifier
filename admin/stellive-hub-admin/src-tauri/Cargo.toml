[package]
name = "stellive-hub-admin"
version = "0.1.0"
description = "Stellive Hub Admin desktop app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "stellive_hub_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "~2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
