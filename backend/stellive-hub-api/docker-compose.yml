x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stellive
      POSTGRES_PASSWORD: stellive
      POSTGRES_DB: stellive_hub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    logging: *default-logging
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  api:
    logging: *default-logging
    image: stellive-hub-api:local
    build:
      context: ../..
      dockerfile: backend/stellive-hub-api/Dockerfile
    env_file:
      - .env.example
      - .env
    environment:
      DATABASE_URL: postgresql://stellive:stellive@postgres:5432/stellive_hub
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports:
      - "4000:4000"
    volumes:
      - ${FCM_SERVICE_ACCOUNT_HOST_FILE:?set FCM_SERVICE_ACCOUNT_HOST_FILE in .env to the host path of the FCM service account JSON}:/run/secrets/fcm-service-account.json:ro
    depends_on:
      - postgres
      - redis

  chzzk-live-worker:
    logging: *default-logging
    image: stellive-hub-api:local
    env_file:
      - .env.example
      - .env
    environment:
      DATABASE_URL: postgresql://stellive:stellive@postgres:5432/stellive_hub
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      CHZZK_LIVE_POLL_SCHEDULER_BASE_URL: http://api:4000
    command: ["npm", "run", "start:chzzk-live-worker"]
    depends_on:
      api:
        condition: service_started
        required: false
      postgres:
        condition: service_started
      redis:
        condition: service_started

  hub-event-status-worker:
    logging: *default-logging
    image: stellive-hub-api:local
    env_file:
      - .env.example
      - .env
    environment:
      DATABASE_URL: postgresql://stellive:stellive@postgres:5432/stellive_hub
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      HUB_EVENT_STATUS_RECONCILE_SCHEDULER_BASE_URL: http://api:4000
    command: ["npm", "run", "start:hub-event-status-worker"]
    depends_on:
      api:
        condition: service_started
        required: false
      postgres:
        condition: service_started
      redis:
        condition: service_started

  music-channel-discovery-worker:
    logging: *default-logging
    image: stellive-hub-api:local
    env_file:
      - .env.example
      - .env
    environment:
      DATABASE_URL: postgresql://stellive:stellive@postgres:5432/stellive_hub
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      MUSIC_CHANNEL_DISCOVERY_SCHEDULER_BASE_URL: http://api:4000
    command: ["npm", "run", "start:music-channel-discovery-worker"]
    depends_on:
      api:
        condition: service_started
        required: false
      postgres:
        condition: service_started
      redis:
        condition: service_started

volumes:
  postgres-data:
