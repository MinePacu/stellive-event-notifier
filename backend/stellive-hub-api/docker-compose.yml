services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stellive
      POSTGRES_PASSWORD: stellive
      POSTGRES_DB: stellive_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ../..
      dockerfile: backend/stellive-hub-api/Dockerfile
    env_file:
      - .env.example
      - .env
    environment:
      DATABASE_URL: postgresql://stellive:stellive@postgres:5432/stellive_hub
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  chzzk-live-worker:
    build:
      context: ../..
      dockerfile: backend/stellive-hub-api/Dockerfile
    env_file:
      - .env.example
      - .env
    environment:
      DATABASE_URL: postgresql://stellive:stellive@postgres:5432/stellive_hub
      REDIS_URL: redis://redis:6379
      CHZZK_LIVE_POLL_SCHEDULER_BASE_URL: http://api:4000
    command: ["npm", "run", "start:chzzk-live-worker"]
    depends_on:
      - api

volumes:
  postgres-data:
