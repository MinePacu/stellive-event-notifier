worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream stellive_hub_api {
        zone stellive_hub_api 64k;
        least_conn;
        server api-1:4000 resolve max_fails=3 fail_timeout=10s;
        server api-2:4000 resolve max_fails=3 fail_timeout=10s;
        server api-3:4000 resolve max_fails=3 fail_timeout=10s;
        server api-4:4000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 4000;
        server_name _;

        location / {
            proxy_pass http://stellive_hub_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /v1/events/stream {
            proxy_pass http://stellive_hub_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }
    }
}
