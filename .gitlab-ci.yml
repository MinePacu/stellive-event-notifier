image: ghcr.io/cirruslabs/android-sdk:36

stages:
  - validate
  - test
  - build

variables:
  ANDROID_PROJECT_DIR: "android/StelliveHubAndroid"
  BACKEND_PROJECT_DIR: "backend/stellive-hub-api"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dkotlin.incremental=false"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - android/StelliveHubAndroid/**/*
        - backend/stellive-hub-api/**/*
        - shared/**/*
        - .gitlab-ci.yml
    - when: never

cache:
  key:
    files:
      - android/StelliveHubAndroid/gradle/wrapper/gradle-wrapper.properties
      - android/StelliveHubAndroid/build.gradle.kts
  paths:
    - .gradle/caches/
    - .gradle/wrapper/
  policy: pull-push

.android_gradle_job:
  interruptible: true
  before_script:
    - cd "$ANDROID_PROJECT_DIR"
    - chmod +x ./gradlew
    - ./gradlew --version
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: on_success
    - changes:
        - android/StelliveHubAndroid/**/*
        - shared/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never

.backend_node_job:
  image: node:22-alpine
  interruptible: true
  cache:
    key:
      files:
        - backend/stellive-hub-api/package-lock.json
    paths:
      - backend/stellive-hub-api/.npm/
    policy: pull-push
  before_script:
    - cd "$BACKEND_PROJECT_DIR"
    - npm ci --cache .npm --prefer-offline
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: on_success
    - changes:
        - backend/stellive-hub-api/**/*
        - shared/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never

lint:android:
  stage: validate
  extends: .android_gradle_job
  script:
    - ./gradlew --no-daemon lintDebug
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - android/StelliveHubAndroid/app/build/reports/lint-results-debug.html
      - android/StelliveHubAndroid/app/build/reports/lint-results-debug.xml

verify:backend:
  stage: test
  extends: .backend_node_job
  script:
    - npm run build
    - npm test

test:android:
  stage: test
  extends: .android_gradle_job
  needs:
    - job: lint:android
      artifacts: false
  script:
    - ./gradlew --no-daemon testDebugUnitTest
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - android/StelliveHubAndroid/app/build/reports/tests/
      - android/StelliveHubAndroid/app/build/test-results/testDebugUnitTest/*.xml
    reports:
      junit:
        - android/StelliveHubAndroid/app/build/test-results/testDebugUnitTest/*.xml

build:android:
  stage: build
  extends: .android_gradle_job
  needs:
    - job: lint:android
      artifacts: false
  script:
    - ./gradlew --no-daemon assembleDebug
  artifacts:
    expire_in: 1 week
    paths:
      - android/StelliveHubAndroid/app/build/outputs/apk/debug/*.apk
