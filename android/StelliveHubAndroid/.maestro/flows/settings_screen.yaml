appId: dev.minepacu.stelliveeventnotifier
name: "Settings: main screen and Targets/Platforms sub-screens"
tags:
  - regression
  - settings
# NOTE: this suite runs against a real device. Deliberately read-only / navigation-only —
# does not toggle any notification switches or appearance mode, since that would persist
# a real setting change on the tester's phone.
#
# Regression coverage for a bug found while writing this suite (fixed in
# fix/settings-back-stack-skips-home): `back` from a Settings sub-screen used to skip the
# Settings root and land on Home. handleSystemBackPressedNow() now treats every Settings
# sub-screen (and History) like the existing Reservation-detail special case — pop one level
# via popScreenNow() instead of jumping straight to the current bottom-nav-tab root.
---
- launchApp:
    stopApp: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "dev.minepacu.stelliveeventnotifier:id/topBarSettings"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "전체 알림"
- assertVisible: "대상별 알림"
- assertVisible: "플랫폼별 알림"

# Targets sub-screen: back must return to Settings, not Home
- tapOn: "대상별 알림"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "분류별 알림"
- back
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "전체 알림"
- assertVisible: "대상별 알림"

# Platforms sub-screen: same check
- tapOn: "플랫폼별 알림"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "알림 적용 기준"
- back
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "전체 알림"
- assertVisible: "플랫폼별 알림"

# Settings root itself is unaffected: back from here still exits to Home
- back
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "dev.minepacu.stelliveeventnotifier:id/collapsedTitle"
    text: "홈"
